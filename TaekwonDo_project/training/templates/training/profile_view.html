{% extends 'training/base.html' %}

{% block content %}
<div class="row mt-4">
    <div class="col-md-8 offset-md-2">
        <div class="card">
            <div class="card-header bg-info text-white">
                <h3><i class="fas fa-user-circle"></i> Profil użytkownika</h3>
            </div>
            <div class="card-body">
                <div class="row mb-3">
                    <div class="col-md-6">
                        <p><strong>Użytkownik:</strong> {{ user.username }}</p>
                        <p><strong>Email:</strong> {{ user.email }}</p>
                    </div>
                    <div class="col-md-6">
                        <p><strong>Imię:</strong> {{ user.first_name }}</p>
                        <p><strong>Nazwisko:</strong> {{ user.last_name }}</p>
                    </div>
                </div>
                <hr>
                <a href="{% url 'training:profile_edit' %}" class="btn btn-primary"><i class="fas fa-edit"></i> Edytuj profil</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
