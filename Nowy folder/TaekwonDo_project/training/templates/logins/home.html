{% extends "base.html" %}
{% block content %}
<h1>Witaj, {% if user.is_authenticated %}{{ user.get_full_name|default:user.username }}{% else %}Gość{% endif %}!</h1>
<p>To jest strona główna.</p>

<form method="post" action="{% url 'training:logout' %}">
    {% csrf_token %}
    <button type="submit">Wyloguj</button>
</form>

{% endblock content %}
